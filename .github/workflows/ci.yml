name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Two Go versions only: the oldest this module supports (go.mod says
    # 1.19) and the current release. Testing every version in between adds
    # noise, not signal — the interesting boundary is "works on the
    # minimum" and "works on the latest".
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ["1.19", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Test
        run: go test -race -shuffle=on -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Benchmarks compile and run
        run: go test -run='^$' -bench=. -benchtime=1x ./...

      - name: Fuzz (short)
        shell: bash
        run: |
          # go test refuses -fuzz= with multiple matches, so fuzz each target
          # separately. The regex is anchored: unanchored, FuzzTransform also
          # matches FuzzTransformNested.
          for f in $(go test -list='^Fuzz' -run='^$' . | grep '^Fuzz'); do
            go test -fuzz="^$f\$" -fuzztime=10s -run='^$' .
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: govulncheck
        uses: golang/govulncheck-action@v1

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Coverage
        run: |
          go test -coverprofile=coverage.out -covermode=atomic .
          go tool cover -func=coverage.out

      - name: Coverage gate
        shell: bash
        run: |
          go tool cover -func=coverage.out | awk '/^total:/{sub(/%/,"",$3); if ($3+0 < 85) { printf "coverage %.1f%% below 85%% gate\n", $3; exit 1 }}'

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

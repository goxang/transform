name: OSV-Scanner

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '44 15 * * 5'

permissions:
  contents: read

jobs:
  # The module has no dependencies, so today this only watches the Go
  # toolchain and the actions used below. That is the point: it stays quiet
  # until the first dependency arrives, and speaks up the moment one does.
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67  # v2.5.1
    with:
      scan-args: |-
        --recursive
        ./
    permissions:
      actions: read
      contents: read
      # Needed to upload the SARIF report to the security tab.
      security-events: write

  scan-pr:
    if: ${{ github.event_name == 'pull_request' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67  # v2.5.1
    with:
      scan-args: |-
        --recursive
        ./
    permissions:
      actions: read
      contents: read
      security-events: write
